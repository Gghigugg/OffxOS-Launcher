name: Fix Home Motion Build
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'Fix Home Motion handler'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix handler calls
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/offxos/launcher/MainActivity.java')
          s=p.read_text()
          s=s.replace('postDelayed(()->openFolder(f.name)', 'handler.postDelayed(()->openFolder(f.name)')
          s=s.replace('postDelayed(()->{try{startActivity(a.intent);}', 'handler.postDelayed(()->{try{startActivity(a.intent);}')
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/offxos/launcher/MainActivity.java .github/workflows/fix-home-motion.yml
          git commit -m "Fix Home Motion handler" || true
          git push || true
      - name: Remove one-shot workflow
        run: |
          git rm .github/workflows/fix-home-motion.yml || true
          git commit -m "Remove one-shot home motion fix workflow" || true
          git push || true
