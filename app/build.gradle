plugins { id 'com.android.application' }

android {
    namespace 'com.offxos.launcher'
    compileSdk 35

    defaultConfig {
        applicationId 'com.offxos.launcher'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '2.0'
    }

    signingConfigs {
        release {
            def releaseStorePassword = System.getenv('OFFXOS_STORE_PASSWORD') ?: 'offxos-local'
            storeFile file(System.getenv('OFFXOS_KEYSTORE') ?: (System.getProperty('user.home') + '/.android/offxos-release.keystore'))
            storePassword releaseStorePassword
            keyAlias 'offxos'
            keyPassword releaseStorePassword
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }
}
