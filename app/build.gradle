plugins { id 'com.android.application' }

android {
    namespace 'com.offxos.launcher'
    compileSdk 36

    defaultConfig {
        applicationId 'com.offxos.launcher.v3'
        minSdk 26
        targetSdk 36
        versionCode 4
        versionName '4.0'
    }

    signingConfigs {
        release {
            def releaseStorePassword = System.getenv('OFFXOS_STORE_PASSWORD') ?: 'offxos-local'
            storeFile file(System.getenv('OFFXOS_KEYSTORE') ?: (System.getProperty('user.home') + '/.android/offxos-release.keystore'))
            storePassword releaseStorePassword
            keyAlias 'offxos'
            keyPassword releaseStorePassword
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }
}
